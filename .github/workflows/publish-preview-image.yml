name: Publish Matt Sidnell portfolio preview image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ops/Dockerfile.preview"
      - "ops/staging/nginx.conf"
      - ".dockerignore"
      - ".github/workflows/publish-preview-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable staging website
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.preview
          push: true
          platforms: linux/amd64
          tags: ghcr.io/mattsidnell/portfolio-mattsidnell-previews:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mattsidnell/portfolio-mattsidnell-previews
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Matt Sidnell portfolio staging website
      - name: Record digest for Ops package release
        run: |
          echo "Image: ghcr.io/mattsidnell/portfolio-mattsidnell-previews@${{ steps.image.outputs.digest }}"
          echo "Revision: ${{ github.sha }}"
          echo "Use this digest as the immutable container identity in the Ops package catalogue."
