server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Internal-only PHP-FPM backend. Never expose port 9000.
  location ~ ^/api/(contact|analytics)$ {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    fastcgi_read_timeout 12s;
    fastcgi_pass mattsidnell-php-prod:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_SEC_FETCH_SITE $http_sec_fetch_site;
    fastcgi_param HTTP_IDEMPOTENCY_KEY $http_idempotency_key;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    access_log off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
  location = / {
    try_files /index.html =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }

  location ~* \.(?:png|jpe?g|webp|svg|ico|css|js)$ {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
