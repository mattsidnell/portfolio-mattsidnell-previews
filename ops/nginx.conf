server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /_health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ =404; }
}
